<!-- Header -->
<header class="header" role="banner">
    <div class="header__container">

        <div class="header__left">
            <button class="header__menu-toggle menu-icon" aria-label="Toggle Sidebar" aria-controls="sidebar" aria-expanded="true">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

            <div class="header__search d-none d-md-block">
                <div class="header__search-wrapper" role="search">
                    <i class="bi bi-search header__search-icon" aria-hidden="true"></i>
                    <input type="text" class="header__search-input" placeholder="Search architecture..." aria-label="Search through site content">
                </div>
            </div>
        </div>

        <div class="header__right">
            <div class="header__actions">
                <div class="dropdown header__dropdown">
                    <button class="header__action-btn me-2" data-bs-toggle="offcanvas" data-bs-target="#rightSidebar" aria-label="Open Settings Panel" aria-controls="rightSidebar">
                        <i class="bi bi-gear" aria-hidden="true"></i>
                    </button>
                    <button class="header__action-btn header__action-btn--badge" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="View Notifications">
                        <i class="bi bi-bell" aria-hidden="true"></i>
                        {{> notification-badge id="header-notification-badge" count="5" class="position-absolute top-0
                        start-100 translate-middle" }}
                    </button>
                    <div class="dropdown-menu dropdown-menu-end header__dropdown-menu shadow" role="menu">
                        <h6 class="dropdown-header">Notifications</h6>
                        <a class="dropdown-item header__dropdown-item" href="/app/pages/notification.html" role="menuitem">
                            <img src="/app/src/images/photo1.jpg" alt="Profile of Jennifer Oster" class="header__dropdown-img">
                            <div class="header__dropdown-info">
                                <span class="header__dropdown-title">Jennifer O. Oster</span>
                                <small class="header__dropdown-text">New patient registered</small>
                            </div>
                        </a>
                        <a class="dropdown-item header__dropdown-item" href="/app/pages/notification.html" role="menuitem">
                            <img src="/app/src/images/photo2.jpg" alt="Profile of Notification Sender" class="header__dropdown-img">
                            <div class="header__dropdown-info">
                                <span class="header__dropdown-title">Jennifer O. Oster</span>
                                <small class="header__dropdown-text">New patient registered</small>
                            </div>
                        </a>
                        <a class="dropdown-item header__dropdown-item" href="/app/pages/notification.html" role="menuitem">
                            <img src="/app/src/images/photo3.jpg" alt="Profile of Notification Sender" class="header__dropdown-img">
                            <div class="header__dropdown-info">
                                <span class="header__dropdown-title">Jennifer O. Oster</span>
                                <small class="header__dropdown-text">New patient registered</small>
                            </div>
                        </a>
                        <a class="dropdown-item header__dropdown-item" href="/app/pages/notification.html" role="menuitem">
                            <img src="/app/src/images/photo4.jpg" alt="Profile of Notification Sender" class="header__dropdown-img">
                            <div class="header__dropdown-info">
                                <span class="header__dropdown-title">Jennifer O. Oster</span>
                                <small class="header__dropdown-text">New patient registered</small>
                            </div>
                        </a>
                        <a class="dropdown-item header__dropdown-item" href="/app/pages/notification.html" role="menuitem">
                            <img src="/app/src/images/photo5.jpg" alt="Profile of Notification Sender" class="header__dropdown-img">
                            <div class="header__dropdown-info">
                                <span class="header__dropdown-title">Jennifer O. Oster</span>
                                <small class="header__dropdown-text">New patient registered</small>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

            <div class="dropdown header__user">
                <button class="header__user-btn" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="User account menu">
                    <img src="/app/src/images/photo5.jpg" alt="Current User: John Doe" class="header__user-img">
                    <span class="header__user-name d-none d-sm-inline">John Doe</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end header__dropdown-menu shadow" role="menu">
                    <li>
                        <a class="dropdown-item" href="/app/pages/profile.html" role="menuitem">
                            <i class="bi bi-person me-2" aria-hidden="true"></i> Profile
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="/app/pages/account-settings.html" role="menuitem">
                            <i class="bi bi-gear me-2" aria-hidden="true"></i> Account Settings
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="/app/pages/help-support.html" role="menuitem">
                            <i class="bi bi-1-circle me-2" aria-hidden="true"></i> Help
                        </a>
                    </li>
                    <li><a class="dropdown-item text-danger" href="/app/pages/auth/login.html" role="menuitem"><i
                                class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>
                            Logout</a></li>
                </ul>
            </div>

            <div class="header__github">
                <a href="https://github.com/xivig" target="_blank" class="header__github-link" aria-label="View Xivig on GitHub">
                    <img src="/app/src/images/github.svg" alt="GitHub Logo" width="24">
                </a>
            </div>
        </div>
    </div>
</header>
