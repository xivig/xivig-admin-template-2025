<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>Reset Password | Xivig Elite</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection & Critical Style Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'auto';
            let resolvedTheme = savedTheme;
            if (savedTheme === 'auto') {
                resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', resolvedTheme);
            const bgColor = resolvedTheme === 'dark' ? '#0b0f12' : '#f8fafc';
            document.write(`<style>body{background-color: ${bgColor} !important;}</style>`);
        })();
    </script>
    
    <!-- Critical Preloader Style -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        .preloader--hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        body.preloader-active:not(.is-loaded) {
            overflow: hidden;
        }
    </style>
    
    <script>
        (function() {
            var dismissPreloader = function() {
                if (document.body) {
                    document.body.classList.add('is-loaded');
                    document.body.classList.remove('preloader-active');
                }
                var loader = document.querySelector('.preloader');
                if (loader && !loader.classList.contains('preloader--hidden')) {
                    loader.classList.add('preloader--hidden');
                    setTimeout(function() {
                        loader.style.display = 'none';
                    }, 500);
                }
            };
            var markActive = function() {
                if (document.body && !document.body.classList.contains('is-loaded')) {
                    document.body.classList.add('preloader-active');
                }
                setTimeout(dismissPreloader, 2200);
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', markActive, { once: true });
            } else {
                markActive();
            }
            window.addEventListener('load', function() {
                setTimeout(dismissPreloader, 800);
            }, { once: true });
        })();
    </script>
    
    <!-- Vendor Styles (Essential Only) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Global jQuery Exposure (Critical for Plugins) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.jQuery = window.$ = jQuery;
    </script>
  <script type="module" crossorigin src="./assets/mobile-controller.js"></script>
  <script type="module" crossorigin src="./assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="./assets/vendor-jquery.js"></script>
  <script type="module" crossorigin src="./assets/vendor-core.js"></script>
  <script type="module" crossorigin src="./assets/auth.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="./assets/auth.css">
</head>

<body class="auth-page">

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="preloader__box text-center">
            <div class="preloader__logo mb-3">
                <img src="./assets/xivig-logo.png" alt="Logo" width="120" />
            </div>
            <div class="preloader__progress">
                <div class="preloader__bar" id="bar1"></div>
            </div>
            <div class="preloader__percent" id="percent1">0%</div>
            <div class="preloader__text">Initializing Elite Dashboard</div>
        </div>
    </div>
    <div class="mobile-menu-overlay"></div>
    <div class="auth-card animate__animated animate__zoomIn">
        
        <div class="text-center">
            <div class="mb-4">
                <i class="bi bi-key text-primary display-4"></i>
            </div>
            <h2 class="auth-card__title">Reset Password</h2>
            <p class="auth-card__subtitle">Enter your new secure password below.</p>
        </div>
        
        <form action="./login.html">
            <div class="mb-4">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control" placeholder="New Password" required>
                </div>
            </div>
        
            <div class="mb-4">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control" placeholder="Confirm Password" required>
                </div>
            </div>
        
            <button type="submit" class="btn btn-primary rounded-pill w-100 py-3 rounded-3 fw-bold shadow-sm mb-4">
                Update Password
            </button>
        
            <p class="text-center small text-muted mb-0">
                Changed your mind? <a href="./login.html" class="auth-link">Back to Login</a>
            </p>
        </form>
        
    </div>

</body>

</html>
